baseURL = "https://elgane.no/"
locale = "nb"
defaultContentLanguage = "nb"
title = "Elgane Motorsykkelklubb"

# Pagination
[pagination]
  pagerSize = 9

# Permalink structure
[permalinks]
  nyheter = "/nyheter/:slug/"

# Taxonomy
[taxonomies]
  kategori = "kategorier"

# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true

# Site parameters
[params]
  description = "Motorsykkelklubb med ATV & Sidevogn, MX og Speedway"
  author = "Elgane Motorsykkelklubb"
  logo = "/images/logo.svg"
  email = "post@elgane.no"
  phone = ""
  address = "Elgane, 4360 Varhaug"
  facebook = ""
  instagram = ""
  orgNummer = ""

  colorPrimary = "#3fb970"
  colorDark = "#1a1a1a"
  colorATV = "#3fb970"
  colorMX = "#ff9800"
  colorSpeedway = "#8B5E3C"

  dateFormat = "2. January 2006"

