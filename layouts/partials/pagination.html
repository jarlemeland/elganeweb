{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Sidenavigasjon">
  {{ if $paginator.HasPrev }}
  <a href="{{ $paginator.Prev.URL }}" aria-label="Forrige side">&laquo; Forrige</a>
  {{ end }}

  {{ range $paginator.Pagers }}
  {{ if eq . $paginator }}
  <span class="pagination--current" aria-current="page">{{ .PageNumber }}</span>
  {{ else }}
  <a href="{{ .URL }}">{{ .PageNumber }}</a>
  {{ end }}
  {{ end }}

  {{ if $paginator.HasNext }}
  <a href="{{ $paginator.Next.URL }}" aria-label="Neste side">Neste &raquo;</a>
  {{ end }}
</nav>
{{ end }}
