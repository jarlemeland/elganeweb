{{ define "main" }}
<article class="article">
  <div class="container container--narrow">
    {{ partial "breadcrumb.html" . }}

    <header class="article__header">
      <h1 class="article__title">{{ .Title }}</h1>
    </header>

    <div class="article__content">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
