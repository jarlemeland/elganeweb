backend:
  name: git-gateway
  branch: main

locale: "nb"

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # --- NEWS POSTS ---
  - name: "nyheter"
    label: "Nyheter"
    folder: "content/nyheter"
    create: true
    slug: "{{slug}}"
    sort: "date:desc"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Publiseringsdato", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Beskrivelse", name: "description", widget: "string", required: false, hint: "Kort beskrivelse for SEO og deling" }
      - label: "Kategorier"
        name: "kategorier"
        widget: "select"
        multiple: true
        options:
          - "Nyheter"
          - "Arrangementer"
          - "ATV & Sidevogn"
          - "MX"
          - "Speedway"
      - { label: "Hovedbilde", name: "image", widget: "image", required: false, hint: "Anbefalt 1200x675px (16:9)" }
      - { label: "Utkast", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Innhold", name: "body", widget: "markdown" }

  # --- BRANCH PAGES ---
  - name: "grener"
    label: "Grener"
    folder: "content/grener"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Beskrivelse", name: "description", widget: "string", required: false }
      - label: "Gren"
        name: "discipline"
        widget: "select"
        options:
          - { label: "ATV & Sidevogn", value: "atv" }
          - { label: "MX", value: "mx" }
          - { label: "Speedway", value: "speedway" }
      - { label: "Farge", name: "color", widget: "string", hint: "Hex-farge for grenen, f.eks. #3fb970" }
      - { label: "Treningsdager", name: "treningsdager", widget: "string" }
      - { label: "Treningstid", name: "treningstid", widget: "string" }
      - { label: "Sesong", name: "sesong", widget: "string" }
      - { label: "Kontaktperson", name: "kontaktperson", widget: "string", required: false }
      - { label: "Kontakt e-post", name: "kontaktepost", widget: "string", required: false }
      - { label: "Kontakt telefon", name: "kontakttelefon", widget: "string", required: false }
      - { label: "Hovedbilde", name: "image", widget: "image", required: false }
      - { label: "Innhold", name: "body", widget: "markdown" }

  # --- STANDALONE PAGES ---
  - name: "sider"
    label: "Sider"
    files:
      - label: "Forside"
        name: "forside"
        file: "content/_index.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Undertittel", name: "subtitle", widget: "string", required: false }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Hero-bilde", name: "hero_image", widget: "image", required: false }
          - { label: "CTA-tekst", name: "cta_text", widget: "string", default: "Bli med", required: false }
          - { label: "CTA-lenke", name: "cta_url", widget: "string", default: "/kontakt/", required: false }
          - { label: "Innhold", name: "body", widget: "markdown", required: false }

      - label: "Om klubben"
        name: "om-klubben"
        file: "content/om-klubben.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Innhold", name: "body", widget: "markdown" }

      - label: "Kontakt"
        name: "kontakt"
        file: "content/kontakt.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Layout", name: "layout", widget: "hidden", default: "kontakt" }
          - { label: "Type", name: "type", widget: "hidden", default: "kontakt" }
          - { label: "Innhold", name: "body", widget: "markdown" }

      - label: "Bane og kart"
        name: "bane-og-kart"
        file: "content/bane-og-kart.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Innhold", name: "body", widget: "markdown" }

      - label: "Treningsplan"
        name: "treningsplan"
        file: "content/treningsplan.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Innhold", name: "body", widget: "markdown" }

      - label: "Personvern"
        name: "personvern"
        file: "content/personvern.md"
        fields:
          - { label: "Tittel", name: "title", widget: "string" }
          - { label: "Beskrivelse", name: "description", widget: "string", required: false }
          - { label: "Innhold", name: "body", widget: "markdown" }

  # --- EVENTS CALENDAR ---
  - name: "arrangementer"
    label: "Arrangementer"
    files:
      - label: "Arrangementer"
        name: "arrangementer"
        file: "data/arrangementer.yaml"
        fields:
          - { label: "Sesong", name: "sesong", widget: "string" }
          - { label: "Sist oppdatert", name: "oppdatert", widget: "string", hint: "YYYY-MM-DD" }
          - label: "Arrangementer"
            name: "arrangementer"
            widget: "list"
            summary: "{{fields.dato}} - {{fields.navn}} ({{fields.gren}})"
            fields:
              - { label: "Dato", name: "dato", widget: "string", hint: "Format: YYYY-MM-DD (f.eks. 2026-07-04)" }
              - { label: "Navn", name: "navn", widget: "string", hint: "Navn på arrangementet" }
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "Konkurranse", value: "konkurranse" }
                  - { label: "Arrangement", value: "arrangement" }
                  - { label: "Kurs", value: "kurs" }
                  - { label: "Møte", value: "mote" }
                  - { label: "Vedlikehold", value: "vedlikehold" }
              - label: "Gren"
                name: "gren"
                widget: "select"
                options:
                  - "ATV & Sidevogn"
                  - "MX"
                  - "Speedway"
                  - "Alle"
              - { label: "Sted", name: "sted", widget: "string", hint: "F.eks. Elgane, Sykkylven" }
              - { label: "Starttid", name: "tid_start", widget: "string", required: false, default: "", hint: "Format: HH:MM (valgfritt)" }
              - { label: "Sluttid", name: "tid_slutt", widget: "string", required: false, default: "", hint: "Format: HH:MM (valgfritt)" }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Bekreftet", value: "bekreftet" }
                  - { label: "Planlagt", value: "planlagt" }
                  - { label: "Avlyst", value: "avlyst" }
                  - { label: "Utsatt", value: "utsatt" }
                default: "bekreftet"
              - { label: "Beskrivelse", name: "beskrivelse", widget: "string", required: false, default: "" }
              - { label: "Lenke (URL)", name: "lenke", widget: "string", required: false, default: "", hint: "Lenke til påmelding e.l. (f.eks. https://www.isonen.no/...)" }
              - { label: "Lenketekst", name: "lenke_tekst", widget: "string", required: false, default: "", hint: "Tekst på lenkeknappen (standard: Påmelding)" }
              - { label: "Merknad", name: "merknad", widget: "string", required: false, default: "" }

  # --- BOARD (STYRET) ---
  - name: "styret"
    label: "Styret"
    files:
      - label: "Styret"
        name: "styret"
        file: "data/styret.yaml"
        fields:
          - { label: "Sesong", name: "sesong", widget: "string", hint: "F.eks. 2026" }
          - { label: "Sist oppdatert", name: "oppdatert", widget: "string", hint: "YYYY-MM-DD" }
          - label: "Medlemmer"
            name: "medlemmer"
            widget: "list"
            summary: "{{fields.verv}} - {{fields.navn}}"
            fields:
              - { label: "Verv", name: "verv", widget: "string", hint: "F.eks. Styreleder, Nestleder, Kasserer, Styrerepresentant Speedway" }
              - { label: "Navn", name: "navn", widget: "string" }
              - { label: "Telefon", name: "telefon", widget: "string", required: false, default: "", hint: "Mobilnummer uten landkode (8 siffer)" }
              - { label: "E-post", name: "epost", widget: "string", required: false, default: "" }
              - label: "Gren (valgfritt)"
                name: "gren"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "Ingen", value: "" }
                  - "ATV & Sidevogn"
                  - "MX"
                  - "Speedway"
              - { label: "Merknad", name: "merknad", widget: "string", required: false, default: "", hint: "Valgfri tilleggsinfo, f.eks. 'Kontaktperson ATV'" }

  # --- TRAINING SCHEDULE ---
  # Treningsplanen genereres automatisk fra ukentlige regler.
  # Bruk "Overstyringer" for å markere avlyste treninger eller registrere
  # sikkerhetsleder for en spesifikk dato.
  - name: "treningsplan"
    label: "Treningsplan"
    files:
      - label: "Treningsplan"
        name: "treningsplan"
        file: "data/treningsplan.yaml"
        fields:
          - { label: "Sesong", name: "sesong", widget: "string", hint: "F.eks. 2026" }
          - { label: "Sist oppdatert", name: "oppdatert", widget: "string", hint: "YYYY-MM-DD" }
          - { label: "Sesongstart", name: "sesongstart", widget: "string", hint: "YYYY-MM-DD — første dag treninger kan starte" }
          - { label: "Sesongslutt", name: "sesongslutt", widget: "string", hint: "YYYY-MM-DD — siste dag treninger kan kjøres" }

          - label: "Ukentlige regler"
            name: "regler"
            widget: "list"
            summary: "{{fields.gren}}"
            hint: "Endres sjelden — definerer hvilke ukedager hver gren trener."
            fields:
              - label: "Gren"
                name: "gren"
                widget: "select"
                options:
                  - "ATV & Sidevogn"
                  - "MX"
                  - "Speedway"
              - { label: "Sesongstart (valgfritt)", name: "sesongstart", widget: "string", required: false, default: "", hint: "YYYY-MM-DD — overstyrer global sesongstart for denne grenen" }
              - { label: "Sesongslutt (valgfritt)", name: "sesongslutt", widget: "string", required: false, default: "", hint: "YYYY-MM-DD — overstyrer global sesongslutt for denne grenen" }
              - label: "Treningsøkter"
                name: "okter"
                widget: "list"
                summary: "Ukedag {{fields.ukedag}} kl. {{fields.tid_start}}–{{fields.tid_slutt}}"
                fields:
                  - label: "Ukedag"
                    name: "ukedag"
                    widget: "select"
                    options:
                      - { label: "Søndag", value: 0 }
                      - { label: "Mandag", value: 1 }
                      - { label: "Tirsdag", value: 2 }
                      - { label: "Onsdag", value: 3 }
                      - { label: "Torsdag", value: 4 }
                      - { label: "Fredag", value: 5 }
                      - { label: "Lørdag", value: 6 }
                  - { label: "Starttid", name: "tid_start", widget: "string", hint: "Format: HH:MM" }
                  - { label: "Sluttid", name: "tid_slutt", widget: "string", hint: "Format: HH:MM" }

          - label: "Overstyringer"
            name: "overstyringer"
            widget: "list"
            summary: "{{fields.dato}}{{fields.gren | ternary ' (' ''}}{{fields.gren}}{{fields.gren | ternary ')' ''}} - {{fields.merknad}}"
            hint: "Spesifikke datoer: avlyst, sikkerhetsleder, merknad, ev. endret tid. Hvis 'Gren' er tom, gjelder overstyringen for alle grener den dagen."
            required: false
            fields:
              - { label: "Dato", name: "dato", widget: "string", hint: "Format: YYYY-MM-DD" }
              - label: "Gren (valgfritt)"
                name: "gren"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "Alle grener", value: "" }
                  - "ATV & Sidevogn"
                  - "MX"
                  - "Speedway"
              - label: "Status"
                name: "status"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "(uendret)", value: "" }
                  - { label: "Bekreftet", value: "bekreftet" }
                  - { label: "Avlyst", value: "avlyst" }
                  - { label: "Utsatt", value: "utsatt" }
                  - { label: "Trenger sikkerhetsleder", value: "trenger_sikkerhetsleder" }
              - { label: "Sikkerhetsleder", name: "sikkerhetsleder", widget: "string", required: false, default: "", hint: "Navn på sikkerhetsleder for denne datoen" }
              - { label: "Merknad", name: "merknad", widget: "string", required: false, default: "" }
              - { label: "Starttid (overstyring)", name: "tid_start", widget: "string", required: false, default: "", hint: "Bruk hvis tiden avviker fra regelen" }
              - { label: "Sluttid (overstyring)", name: "tid_slutt", widget: "string", required: false, default: "" }
