# Treningsplan-konfigurasjon
#
# Treningsplanen genereres automatisk basert på ukentlige regler nedenfor.
# Bruk "overstyringer" for å markere avlyste treninger, registrere
# sikkerhetsleder for en bestemt dato, eller legge til merknader.
#
# Når sesongen er over, oppdater sesongstart/sesongslutt og ev. reglene.

sesong: "2026"
oppdatert: "2026-06-09"

# Global sesong dekker hele perioden hvor noen gren kan ha trening.
# Per gren kan man overstyre med egen sesongstart/sesongslutt i regelen.
sesongstart: "2026-04-01"
sesongslutt: "2027-03-31"

# Ukentlige treningsregler.
# ukedag: 0=søndag, 1=mandag, 2=tirsdag, 3=onsdag, 4=torsdag, 5=fredag, 6=lørdag
regler:
  - gren: "ATV & Sidevogn"
    # ATV trener hele året (april 2026 - mars 2027).
    okter:
      - ukedag: 6  # lørdag
        tid_start: "11:00"
        tid_slutt: "14:00"
      - ukedag: 4  # torsdag
        tid_start: "17:00"
        tid_slutt: "20:00"

  - gren: "MX"
    # MX trener i utesesongen. Vinterdager kan legges til som
    # overstyringer hvis SL bekreftes.
    sesongslutt: "2026-10-31"
    okter:
      - ukedag: 0  # søndag
        tid_start: "12:00"
        tid_slutt: "16:00"
      - ukedag: 2  # tirsdag
        tid_start: "17:00"
        tid_slutt: "20:00"

  - gren: "Speedway"
    sesongslutt: "2026-10-31"
    okter:
      - ukedag: 1  # mandag
        tid_start: "17:00"
        tid_slutt: "20:00"
      - ukedag: 3  # onsdag
        tid_start: "17:00"
        tid_slutt: "20:00"

# Overstyringer for spesifikke datoer.
# - Hvis 'gren' er satt, gjelder overstyringen kun for den grenen den dagen.
# - Hvis 'gren' er tom, gjelder den for alle grener den dagen.
# Mulige felter (alle valgfrie):
#   status: bekreftet | avlyst | utsatt | trenger_sikkerhetsleder
#   sikkerhetsleder: navn
#   merknad: kort tekst
#   tid_start / tid_slutt: HH:MM (overstyrer regelens tid)
